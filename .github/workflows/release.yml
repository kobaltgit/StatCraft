name: "Release"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'
      publish_release:
        description: 'Publish GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            target_arch: ""
            asset_name: statcraft-windows-x64
            archive_name: statcraft-windows-x64.zip
            installer_name: statcraft-windows-x64-installer.exe
            binary_name: statcraft_app.exe
            binary_path: target/release/statcraft_app.exe
          - os: ubuntu-22.04
            target_os: linux
            target_arch: ""
            asset_name: statcraft-linux-x64
            archive_name: statcraft-linux-x64.tar.gz
            installer_name: statcraft-linux-x64.deb
            binary_name: statcraft_app
            binary_path: target/release/statcraft_app
          - os: macos-latest
            target_os: macos
            target_arch: "aarch64-apple-darwin"
            asset_name: statcraft-macos-arm64
            archive_name: statcraft-macos-arm64.tar.gz
            installer_name: statcraft-macos-arm64.dmg
            binary_name: statcraft_app
            binary_path: target/aarch64-apple-darwin/release/statcraft_app
          - os: macos-latest
            target_os: macos
            target_arch: "x86_64-apple-darwin"
            asset_name: statcraft-macos-x64
            archive_name: statcraft-macos-x64.tar.gz
            installer_name: statcraft-macos-x64.dmg
            binary_name: statcraft_app
            binary_path: target/x86_64-apple-darwin/release/statcraft_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target_arch }}

      - name: Build StatCraft in Release Mode (Windows)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: cargo build --package statcraft_app --release -j 1

      - name: Build StatCraft in Release Mode (Unix)
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          if [ -n "${{ matrix.target_arch }}" ]; then
            cargo build --package statcraft_app --release --target ${{ matrix.target_arch }} -j 1
          else
            cargo build --package statcraft_app --release -j 1
          fi

      - name: Package Windows Artifacts (Portable & Installer)
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          # 1. Portable ZIP
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item ${{ matrix.binary_path }} staging/
          Copy-Item -Recurse locales staging/locales
          Copy-Item README.md staging/
          Copy-Item README.ru.md staging/
          Copy-Item LICENSE-MIT staging/
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path staging/* -DestinationPath dist/${{ matrix.archive_name }}

          # 2. Inno Setup Installer
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc packaging/windows/installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          } else {
            choco install innosetup --no-progress -y
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          }

      - name: Package Linux Artifacts (Portable & .deb Installer)
        if: matrix.target_os == 'linux'
        shell: bash
        run: |
          # 1. Portable TAR.GZ
          mkdir -p staging
          cp ${{ matrix.binary_path }} staging/
          chmod +x staging/${{ matrix.binary_name }}
          cp -r locales staging/
          cp README.md staging/
          cp README.ru.md staging/
          cp LICENSE-MIT staging/
          mkdir -p dist
          tar -czvf dist/${{ matrix.archive_name }} -C staging .

          # 2. Debian .deb Package
          DEB_DIR=deb_staging
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/share/statcraft"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          cp ${{ matrix.binary_path }} "$DEB_DIR/usr/bin/${{ matrix.binary_name }}"
          chmod +x "$DEB_DIR/usr/bin/${{ matrix.binary_name }}"
          cp -r locales "$DEB_DIR/usr/share/statcraft/"
          cp README.md README.ru.md LICENSE-MIT "$DEB_DIR/usr/share/statcraft/"

          cp packaging/linux/statcraft.desktop "$DEB_DIR/usr/share/applications/"
          cp assets/icon.svg "$DEB_DIR/usr/share/icons/hicolor/scalable/apps/statcraft.svg"
          cp assets/icon-256.png "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/statcraft.png"

          cat << 'EOF' > "$DEB_DIR/DEBIAN/control"
Package: statcraft
Version: 0.2.0
Section: math
Priority: optional
Architecture: amd64
Maintainer: StatCraft Contributors <https://github.com/kobaltgit/StatCraft>
Description: High-performance statistical analysis package and SPSS alternative
 StatCraft provides authentic SPSS-compatible data management, statistical
 modeling, and analysis workflows built on native Rust and modern design.
EOF

          dpkg-deb --build "$DEB_DIR" "dist/${{ matrix.installer_name }}"

      - name: Package macOS Artifacts (Portable & DMG Installer)
        if: matrix.target_os == 'macos'
        shell: bash
        run: |
          # 1. Portable TAR.GZ
          mkdir -p staging
          cp ${{ matrix.binary_path }} staging/${{ matrix.binary_name }}
          chmod +x staging/${{ matrix.binary_name }}
          cp -r locales staging/
          cp README.md staging/
          cp README.ru.md staging/
          cp LICENSE-MIT staging/
          mkdir -p dist
          tar -czvf dist/${{ matrix.archive_name }} -C staging .

          # 2. macOS Application Bundle & DMG Installer
          mkdir -p StatCraft.app/Contents/MacOS
          mkdir -p StatCraft.app/Contents/Resources/locales
          cp ${{ matrix.binary_path }} StatCraft.app/Contents/MacOS/${{ matrix.binary_name }}
          chmod +x StatCraft.app/Contents/MacOS/${{ matrix.binary_name }}
          cp packaging/macos/Info.plist StatCraft.app/Contents/
          cp -r locales/* StatCraft.app/Contents/Resources/locales/
          cp -r locales StatCraft.app/Contents/MacOS/

          mkdir -p icon.iconset
          sips -z 16 16 assets/icon-256.png --out icon.iconset/icon_16x16.png || cp assets/icon-16.png icon.iconset/icon_16x16.png
          sips -z 32 32 assets/icon-256.png --out icon.iconset/icon_16x16@2x.png || cp assets/icon-32.png icon.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon-256.png --out icon.iconset/icon_32x32.png || cp assets/icon-32.png icon.iconset/icon_32x32.png
          sips -z 64 64 assets/icon-256.png --out icon.iconset/icon_32x32@2x.png || cp assets/icon-64.png icon.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon-256.png --out icon.iconset/icon_128x128.png || cp assets/icon-128.png icon.iconset/icon_128x128.png
          sips -z 256 256 assets/icon-256.png --out icon.iconset/icon_128x128@2x.png || cp assets/icon-256.png icon.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon-256.png --out icon.iconset/icon_256x256.png || cp assets/icon-256.png icon.iconset/icon_256x256.png
          sips -z 512 512 assets/icon-256.png --out icon.iconset/icon_256x256@2x.png || true
          sips -z 512 512 assets/icon-256.png --out icon.iconset/icon_512x512.png || true
          sips -z 1024 1024 assets/icon-256.png --out icon.iconset/icon_512x512@2x.png || true
          iconutil -c icns icon.iconset -o StatCraft.app/Contents/Resources/icon.icns || true

          mkdir -p dmg_root
          cp -r StatCraft.app dmg_root/
          ln -s /Applications dmg_root/Applications

          hdiutil create -volname "StatCraft" -srcfolder dmg_root -ov -format UDZO "dist/${{ matrix.installer_name }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.archive_name }}
            dist/${{ matrix.installer_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true'))
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: StatCraft ${{ github.ref_name || inputs.tag }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
