name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'
      publish_release:
        description: 'Publish GitHub Release'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_os: windows
            asset_name: statcraft-windows-x64
            archive_name: statcraft-windows-x64.zip
            binary_name: statcraft_app.exe
          - os: ubuntu-22.04
            target_os: linux
            asset_name: statcraft-linux-x64
            archive_name: statcraft-linux-x64.tar.gz
            binary_name: statcraft_app
          - os: macos-latest
            target_os: macos
            asset_name: statcraft-macos-arm64
            archive_name: statcraft-macos-arm64.tar.gz
            binary_name: statcraft_app
          - os: macos-13
            target_os: macos
            asset_name: statcraft-macos-x64
            archive_name: statcraft-macos-x64.tar.gz
            binary_name: statcraft_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build StatCraft in Release Mode
        run: cargo build --package statcraft_app --release -j 1

      - name: Package Windows Artifacts
        if: matrix.target_os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item target/release/${{ matrix.binary_name }} staging/
          Copy-Item -Recurse locales staging/locales
          Copy-Item README.md staging/
          Copy-Item README.ru.md staging/
          Copy-Item LICENSE-MIT staging/
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path staging/* -DestinationPath dist/${{ matrix.archive_name }}

      - name: Package Unix Artifacts
        if: matrix.target_os != 'windows'
        shell: bash
        run: |
          mkdir -p staging
          cp target/release/${{ matrix.binary_name }} staging/
          chmod +x staging/${{ matrix.binary_name }}
          cp -r locales staging/
          cp README.md staging/
          cp README.ru.md staging/
          cp LICENSE-MIT staging/
          mkdir -p dist
          tar -czvf dist/${{ matrix.archive_name }} -C staging .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.archive_name }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_release == 'true'))
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: StatCraft ${{ github.ref_name || inputs.tag }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
