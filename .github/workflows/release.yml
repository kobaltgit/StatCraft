name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build StatCraft in Release Mode
        shell: pwsh
        run: cargo build --package statcraft_app --release -j 1

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/statcraft_app.exe dist/
          Copy-Item -Recurse locales dist/locales
          Copy-Item README.md dist/
          Copy-Item README.ru.md dist/
          Copy-Item LICENSE-MIT dist/
          Compress-Archive -Path dist/* -DestinationPath dist/statcraft-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: statcraft-windows-x64
          path: dist/statcraft-windows-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: dist/statcraft-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
