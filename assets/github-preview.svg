    <text x="235" y="47" class="font-sans" font-size="10" font-weight="600" fill="#64748b">age</text>
    <text x="365" y="47" class="font-sans" font-size="10" font-weight="600" fill="#64748b">education</text>
    <text x="500" y="47" class="font-sans" font-size="10" font-weight="600" fill="#64748b">salary</text>

    <!-- Row 1: Pearson r -->
    <rect x="0" y="54" width="635" height="24" fill="#111827" fill-opacity="0.7" />
    <text x="16" y="70" class="font-sans" font-size="10" fill="#cbd5e1">Pearson Corr.</text>
    <text x="235" y="70" class="font-mono" font-size="10" fill="#94a3b8">1.000</text>
    <text x="365" y="70" class="font-mono" font-size="10" font-weight="700" fill="#34d399">0.507*</text>
    <text x="500" y="70" class="font-mono" font-size="10" font-weight="700" fill="#34d399">0.642**</text>

    <!-- Row 2: Sig. -->
    <rect x="0" y="78" width="635" height="24" fill="#0d1424" fill-opacity="0.7" />
    <text x="16" y="94" class="font-sans" font-size="10" fill="#cbd5e1">Sig. (2-tailed)</text>
    <text x="235" y="94" class="font-mono" font-size="10" fill="#64748b">—</text>
    <text x="365" y="94" class="font-mono" font-size="10" font-weight="600" fill="#38bdf8">0.023</text>
    <text x="500" y="94" class="font-mono" font-size="10" font-weight="600" fill="#38bdf8">0.001</text>

    <!-- Row 3: N -->
    <rect x="0" y="102" width="635" height="22" fill="#111827" fill-opacity="0.7" />
    <text x="16" y="117" class="font-sans" font-size="10" fill="#cbd5e1">N (active)</text>
    <text x="235" y="117" class="font-mono" font-size="10" fill="#94a3b8">20</text>
    <text x="365" y="117" class="font-mono" font-size="10" fill="#94a3b8">20</text>
    <text x="500" y="117" class="font-mono" font-size="10" fill="#94a3b8">20</text>

    <!-- Table Footnotes -->
    <text x="16" y="139" class="font-sans" font-size="9" fill="#64748b">*. p &lt; .05  **. p &lt; .01 (Two-tailed significance)</text>
  </g>

  <!-- Middle Right: 2. Gaussian Normal Distribution Curve Card -->
  <g transform="translate(580, 345)" filter="url(#shadow-card)">
    <rect width="635" height="130" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />

