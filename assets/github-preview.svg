<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="45%" stop-color="#081024" />
      <stop offset="100%" stop-color="#0c1738" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowBlue" cx="18%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#007AFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="82%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#007AFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottom" cx="50%" cy="92%" r="45%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0" />
    </radialGradient>

    <!-- Text & Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#007AFF" />
    </linearGradient>

    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#007AFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.88" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="32" cy="32" r="1" fill="#38bdf8" fill-opacity="0.18" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow-logo" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#007AFF" flood-opacity="0.5" />
    </filter>

    <filter id="shadow-card" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="640" rx="20" fill="url(#bgGrad)" />
  <rect width="1280" height="640" rx="20" fill="url(#grid)" />
  <rect width="1280" height="640" rx="20" fill="url(#glowBlue)" />
  <rect width="1280" height="640" rx="20" fill="url(#glowCyan)" />
  <rect width="1280" height="640" rx="20" fill="url(#glowBottom)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="1276" height="636" rx="18" fill="none" stroke="#1e293b" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Ambient Mathematical Watermarks -->
  <g class="font-mono" fill="#334155" fill-opacity="0.36" font-size="11.5">
    <text x="65" y="32">// ARTCRAFT ECOSYSTEM STANDARD • 100% SAFE RUST • DETERMINISTIC SPSS ENGINE</text>
    <text x="890" y="32">H₀: μ₁ = μ₂ (Two-Tailed p &lt; .05)</text>
    <text x="1110" y="32">F = MS_b / MS_w</text>
    <text x="65" y="492">r = Σ(x-x̄)(y-ȳ) / √(Σ(x-x̄)²Σ(y-ȳ)²)</text>
    <text x="590" y="492">t = (x̄₁ - x̄₂) / (s_p √(2/n))</text>
    <text x="960" y="492">Levene: F(1, 18) = 0.842, p = .412</text>
  </g>

  <!-- ================= TOP SECTION: HERO BRAND & PILLARS ================= -->
  <!-- Left: Official StatCraft Logo Badge -->
  <g filter="url(#shadow-logo)">
    <svg x="65" y="48" width="112" height="112" viewBox="26 116 560 560">
      <!-- Deep Blue Rounded Shield -->
      <path fill="#000D2B" stroke="#007AFF" stroke-width="20" stroke-linejoin="round" stroke-miterlimit="9.5625" 
            d="M143.4 128.2h267.8c7.6 0 14.9 3 20.3 8.4l133.9 133.9c5.4 5.4 8.4 12.7 8.4 20.3v267.8c0 58.1-47.1 105.2-105.2 105.2H143.4c-58.1 0-105.2-47.1-105.2-105.2V233.3C38.3 175.2 85.3 128.2 143.4 128.2z"/>
      <!-- S Emblem -->
      <path fill="#007AFF" 
            d="M199.5 565.9c-18.3 0-35.5-1.4-51.4-4.3-16-2.9-31-7.3-44.9-13.1l5.1-38.9c16.8 6.8 33 12 48.8 15.5 15.7 3.5 31.1 5.2 46.2 5.2 24.2 0 42.2-4.2 54.1-12.6 11.9-8.4 17.8-21 17.8-37.9 0-21.7-10.9-37.9-32.8-48.4l-68-33c-20.2-9.6-35.6-21.1-46.3-34.4-10.7-13.3-16.1-29.8-16.1-49.3 0-28.5 8.5-50.4 25.4-65.6 16.9-15.2 41.3-22.8 73.3-22.8 21.6 0 40.8 3.3 57.8 9.8 17 6.5 33 16.8 48.1 31l-26.8 27c-14-11-27.3-19.1-39.9-24.3-12.6-5.2-25.6-7.8-39-7.8-19.1 0-33.6 4.2-43.6 12.7-10 8.5-15 21.1-15 37.8 0 11.2 3 20.4 9 27.8 6 7.4 14.8 13.8 26.4 19.4l59.8 29.6c22.3 10.7 39.3 23.1 50.7 37.2 11.5 14.1 17.2 31.7 17.2 52.6 0 29-9.6 50.8-28.7 65.3C267.5 558.7,238.5 565.9 199.5 565.9z"/>
      <!-- t Emblem -->
      <path fill="#007AFF" 
            d="M359.4 397.5v-33.8h149.5v33.8H359.4zM415.7 561.2V363.6h36.7v197.6H415.7z"/>
    </svg>
  </g>

  <!-- Typography Stack -->
  <g transform="translate(195, 48)" class="font-sans">
    <!-- Ecosystem Tag Capsule -->
    <rect x="0" y="0" width="348" height="22" rx="11" fill="#007AFF" fill-opacity="0.15" stroke="#007AFF" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#38bdf8" />
    <text x="24" y="15" font-size="10" font-weight="700" letter-spacing="1.2" fill="#38bdf8">ARTCRAFT ECOSYSTEM • 100% SAFE RUST</text>

