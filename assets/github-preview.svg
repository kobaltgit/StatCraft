    <text x="260" y="110" class="font-sans" font-size="10" fill="#64748b" text-anchor="middle">-1σ</text>
    <text x="400" y="110" class="font-sans" font-size="10" fill="#64748b" text-anchor="middle">+1σ</text>

    <!-- Side Metrics Labels -->
