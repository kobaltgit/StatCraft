    <circle cx="18" cy="278" r="4" fill="#34d399" />
    <text x="30" y="282" class="font-sans" font-size="10.5" font-weight="600" fill="#34d399">Deterministic Execution • Zero Panics • Arrow Buffers</text>
  </g>

