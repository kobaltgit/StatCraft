    <line x1="400" y1="58" x2="400" y2="92" stroke="#475569" stroke-width="1.2" stroke-dasharray="3,3" />

    <!-- 95% Confidence Interval Tag -->
    <rect x="290" y="68" width="80" height="18" rx="9" fill="#007AFF" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="330" y="81" class="font-sans" font-size="10" font-weight="700" fill="#7dd3fc" text-anchor="middle">95% CI</text>

    <!-- Axis Labels -->
