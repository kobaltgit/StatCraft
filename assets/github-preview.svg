    <path d="M 0 10 C 0 4.5, 4.5 0, 10 0 L 480 0 C 485.5 0, 490 4.5, 490 10 L 490 32 L 0 32 Z" fill="#1e293b" />
    <circle cx="16" cy="16" r="4.5" fill="#ef4444" />
    <circle cx="30" cy="16" r="4.5" fill="#f59e0b" />
    <circle cx="44" cy="16" r="4.5" fill="#10b981" />
    <text x="64" y="20" class="font-mono" font-size="11.5" font-weight="600" fill="#94a3b8">pipeline_survey.sps</text>
    
    <rect x="382" y="7" width="96" height="18" rx="4" fill="#007AFF" fill-opacity="0.8" />
    <text x="430" y="20" class="font-sans" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">CommandBus ⚡</text>

    <!-- Syntax Code Block -->
    <g class="font-mono" font-size="11.5" xml:space="preserve">
      <text x="18" y="56" fill="#64748b">* 1. Load dataset with zero allocations</text>
      <text x="18" y="76"><tspan fill="#38bdf8" font-weight="700">GET DATA</tspan><tspan fill="#cbd5e1"> /TYPE=CSV /FILE='sample.csv'.</tspan></text>

      <text x="18" y="106" fill="#64748b">* 2. Bivariate correlation matrix</text>
      <text x="18" y="124"><tspan fill="#38bdf8" font-weight="700">CORRELATIONS</tspan></text>
      <text x="18" y="142" fill="#cbd5e1">  /VARIABLES=age education salary</text>
      <text x="18" y="160" fill="#cbd5e1">  /PRINT=TWOTAIL SIG /MISSING=PAIRWISE.</text>

      <text x="18" y="190" fill="#64748b">* 3. Independent groups t-test</text>
      <text x="18" y="208"><tspan fill="#38bdf8" font-weight="700">T-TEST</tspan><tspan fill="#cbd5e1"> GROUPS=gender(1, 2)</tspan></text>
      <text x="18" y="226" fill="#cbd5e1">  /VARIABLES=salary /CRITERIA=CI(.95).</text>
    </g>

    <!-- Status Bar -->
