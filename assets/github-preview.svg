      <text x="16" y="24" font-weight="700" fill="#cbd5e1">Two-Sample Student's t &amp; Welch Test</text>
      <text x="16" y="38" fill="#64748b">Levene's Variance Test: F = 0.842 (p = .412)</text>
      
      <text x="475" y="24" font-weight="700" fill="#34d399">One-Way ANOVA</text>
      <text x="475" y="38" fill="#64748b">Fisher's F &amp; Post-Hoc Tests</text>
    </g>
  </g>

